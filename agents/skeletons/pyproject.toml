[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "codingsystem-agent-skeletons"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["codingsystem-framework==0.0.1"]

[tool.uv.sources]
codingsystem-framework = {workspace = true}

[tool.setuptools.packages.find]
where = ["src"]
